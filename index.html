<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Profile card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- Write your markup here -->
    <!-- Write your markup here -->
    <div class="card-container">
      <div class="image-container">
        <div class="image-circle"></div>
      </div>
      <div class="card-content">
        <div class="about">
          <h2 class="name">Victor Crest <span class="age">26</span></h2>
          <p>London</p>
        </div>
      </div>
      <div class="card-stats">
        <div class="stats">
          <h3 class="stat-total_1">80K</h3>
          <h3 class="stat-total_2">803K</h3>
          <h3 class="stat-total_3">1.4K</h3>
        </div>
        <div class="stats-name">
          <p class="stat-name_1">Followers</p>
          <p class="stat-name_2">Likes</p>
          <p class="stat-name_3">Photos</p>
        </div>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
